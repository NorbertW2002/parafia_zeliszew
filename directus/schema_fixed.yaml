# Directus 12.2.0 / PostgreSQL schema snapshot
# Fixed: generated UUID primary keys, Polish editor labels/statuses,
# and missing M2M fields/relations for attachments, galleries and homepage highlights.
# Apply inside the Directus container with:
#   node cli.js schema apply --dry-run /directus/schema_fixed.yaml
#   node cli.js schema apply --yes /directus/schema_fixed.yaml

version: 1
directus: 12.2.0
vendor: postgres
